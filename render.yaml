# Render Blueprint — single-service deploy.
# The Express server serves both the API and the built frontend from one
# origin, so no CORS configuration or separate static host is needed.
#
# Deploy: https://dashboard.render.com → New → Blueprint → pick this repo.
# Render will prompt for the values marked `sync: false`.

services:
  - type: web
    name: supportcue
    runtime: node
    plan: free
    region: singapore
    # `--include=dev` is required: NODE_ENV=production (set below) makes npm
    # skip devDependencies, and vite/tailwind/postcss are devDependencies —
    # without it the build fails with "vite: not found".
    # Explicit `cd` rather than `npm --prefix` so binaries resolve from the
    # working directory across npm versions.
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --omit=dev
    startCommand: cd backend && node server.js
    healthCheckPath: /health
    # Node version comes from `.node-version` at the repo root. An open-ended
    # `engines.node` range (">=18") is resolved to the newest Node in existence,
    # which Render cannot always install — that failed the build on 26.6.0.
    envVars:
      - key: NODE_ENV
        value: production

      # The free instance has 512 MB. Cap V8's heap well below that so it
      # garbage-collects instead of being OOM-killed by the container.
      - key: NODE_OPTIONS
        value: --max-old-space-size=400

      # Generated by Render — never leaves the dashboard.
      - key: JWT_SECRET
        generateValue: true
      - key: WIDGET_SECRET
        generateValue: true

      # Prompted at deploy time.
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false

      # Set these to your Render URL once it is assigned, e.g.
      #   https://supportcue.onrender.com
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

      # Optional — company invitation emails. The invite URL is also
      # returned in the API response, so email is not required.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
